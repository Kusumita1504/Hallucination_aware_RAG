services:
  api:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - coffee_diagnosis.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      PYTHONPATH: /app/src
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-phi3}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-haiku-20240307}
      SUPPORT_LLM_ENABLED: ${SUPPORT_LLM_ENABLED:-false}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_MAX_REQUEST_BYTES: ${API_MAX_REQUEST_BYTES:-65536}
      INCIDENT_DB_PATH: /state/incidents.sqlite3
      SLACK_EVENT_DB_PATH: /state/slack_events.sqlite3
      INCIDENT_ERROR_RATE_THRESHOLD: ${INCIDENT_ERROR_RATE_THRESHOLD:-0.2}
      INCIDENT_LATENCY_THRESHOLD_SECONDS: ${INCIDENT_LATENCY_THRESHOLD_SECONDS:-5}
      INCIDENT_WINDOW_SECONDS: ${INCIDENT_WINDOW_SECONDS:-300}
      INCIDENT_MIN_REQUESTS: ${INCIDENT_MIN_REQUESTS:-5}
      SLACK_TIMESTAMP_TOLERANCE_SECONDS: ${SLACK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      INCIDENT_DASHBOARD_URL: ${INCIDENT_DASHBOARD_URL:-http://localhost:3000}
      DIAGNOSIS_EVALUATION_FILE: ${DIAGNOSIS_EVALUATION_FILE:-}
    ports:
      - "8000:8000"
    volumes:
      - coffee-state:/state
      - coffee-vectors:/app/data/vector_db
      - coffee-json-vectors:/app/data/vector_db_json
      - coffee-evaluations:/app/test/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  streamlit:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      PYTHONPATH: /app/src
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-phi3}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-haiku-20240307}
    ports:
      - "8501:8501"
    volumes:
      - coffee-vectors:/app/data/vector_db
      - coffee-json-vectors:/app/data/vector_db_json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  mcp:
    build: .
    profiles: ["mcp"]
    command: ["python", "-m", "coffee_diagnosis.mcp_server"]
    environment:
      PYTHONPATH: /app/src
      INCIDENT_DB_PATH: /state/incidents.sqlite3
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-phi3}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    volumes:
      - coffee-state:/state
      - coffee-vectors:/app/data/vector_db
      - coffee-json-vectors:/app/data/vector_db_json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  coffee-state:
  coffee-vectors:
  coffee-json-vectors:
  coffee-evaluations:
  prometheus-data:
  grafana-data:
